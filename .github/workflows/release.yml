name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '构建版本号 (x.x.x)，留空则自动递增'
        required: false
        type: string
      release:
        description: '发布 Release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── 版本计算 ──
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tag: ${{ steps.calc.outputs.tag }}
      should_release: ${{ steps.calc.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7

      - name: Calculate version
        id: calc
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_FLAG="${{ inputs.release }}"
            VERSION="${{ inputs.version }}"

            if [ "$RELEASE_FLAG" = "true" ]; then
              echo "should_release=true" >> "$GITHUB_OUTPUT"

              if [ -n "$VERSION" ]; then
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
              else
                LATEST=$(curl -fsSL "https://api.github.com/repos/${{ github.repository }}/releases/latest" 2>/dev/null | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')

                if [ -z "$LATEST" ]; then
                  LATEST="0.0.0"
                fi

                MAJOR=$(echo "$LATEST" | cut -d. -f1)
                MINOR=$(echo "$LATEST" | cut -d. -f2)
                PATCH=$(echo "$LATEST" | cut -d. -f3)
                NEW_PATCH=$((PATCH + 1))
                NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"

                echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
                echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
                echo "Auto-incremented: $LATEST → $NEW_VERSION"
              fi
            else
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              echo "version=dev" >> "$GITHUB_OUTPUT"
              echo "tag=dev" >> "$GITHUB_OUTPUT"
            fi

          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 前端构建 ──
  build-frontend:
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload dist
        uses: actions/cache/save@v5
        with:
          path: dist/
          key: frontend-dist-${{ github.sha }}

  # ── 多平台构建 ──
  build:
    needs: [resolve-version, build-frontend]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-amd64
            archive: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            archive: tar.gz

          - target: aarch64-linux-android
            os: ubuntu-latest
            name: android-arm64
            archive: tar.gz

          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            name: windows-amd64
            archive: zip

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v7

      - name: Restore frontend dist
        uses: actions/cache/restore@v5
        with:
          path: dist/
          key: frontend-dist-${{ github.sha }}

      - name: Generate src/static_files.rs
        run: |
          python3 << 'PYEOF'
          import os, glob

          assets = sorted(glob.glob('dist/assets/*'))
          lines = []
          lines.append("// 自动生成，请勿手动编辑")
          lines.append("use std::collections::HashMap;")
          lines.append("")
          lines.append("pub struct StaticFile {")
          lines.append("    pub content: &'static [u8],")
          lines.append("    pub content_type: &'static str,")
          lines.append("}")
          lines.append("")
          lines.append("pub fn load_static_files() -> HashMap<String, StaticFile> {")
          lines.append("    let mut files = HashMap::new();")
          lines.append("")

          for f in assets:
              name = os.path.basename(f)
              if name.endswith('.js'):
                  ct = 'application/javascript'
              elif name.endswith('.css'):
                  ct = 'text/css'
              else:
                  continue
              lines.append('    files.insert(')
              lines.append(f'        "assets/{name}".to_string(),')
              lines.append('        StaticFile {')
              lines.append(f'            content: include_bytes!("../dist/assets/{name}"),')
              lines.append(f'            content_type: "{ct}",')
              lines.append('        },')
              lines.append('    );')
              lines.append('')

          lines.append('    files.insert(')
          lines.append('        "index.html".to_string(),')
          lines.append('        StaticFile {')
          lines.append('            content: include_bytes!("../dist/index.html"),')
          lines.append('            content_type: "text/html; charset=utf-8",')
          lines.append('        },')
          lines.append('    );')
          lines.append('')
          lines.append('    files')
          lines.append('}')
          lines.append('')

          with open('src/static_files.rs', 'w') as f:
              f.write('\n'.join(lines))
          print(f"Generated src/static_files.rs")
          PYEOF

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Non-Android)
        if: matrix.target != 'aarch64-linux-android'
        run: cargo install cross --version 0.2.5

      - name: Install cargo-ndk (Android)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo install cargo-ndk

      - name: Install linker (ARM Linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build (Non-Android)
        if: matrix.target != 'aarch64-linux-android'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (Android)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo ndk -t arm64-v8a build --release

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../unicom_${{ matrix.name }}.tar.gz unicom
          cd ../../..

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../unicom_${{ matrix.name }}.zip unicom.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: unicom_${{ matrix.name }}
          path: unicom_${{ matrix.name }}.*

  # ── 发布 Release ──
  release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    if: needs.resolve-version.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
          pattern: unicom_*

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: "Unicom ${{ needs.resolve-version.outputs.version }}"
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
